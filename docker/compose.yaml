services:
  forge-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: forge-agent:dev
    user: "10001:10001"
    working_dir: /workspace
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - type: bind
        source: ${FORGE_WORKSPACE:?set FORGE_WORKSPACE}
        target: /workspace
