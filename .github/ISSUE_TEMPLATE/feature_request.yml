name: 功能建议
description: 提议一个有明确场景和验收方式的改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明真实使用场景，以及现有能力为什么不足。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述预期接口、行为和边界，不需要先写完整实现。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 给出可自动测试或可复现验证的结果。
    validations:
      required: true
  - type: dropdown
    id: security
    attributes:
      label: 是否改变权限或外部副作用
      options:
        - 否
        - 是，会改变文件、命令、网络、凭据或远程服务边界
        - 尚不确定
    validations:
      required: true
